<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body class="h-screen bg-[#FF5200] py-[5vh] px-[10vw]" >

    <nav class="flex gap-[20vw] text-white font-bold ">
        <img class="h-[8vh] w-[14vw] object-contain " src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png" alt="">
        
        <div class="flex justify-center items-center hidden gap-6 lg:flex block xl:flex block 2xl:flex block">
            <button class=" border-none px-5 py-1 h-[7vh] rounded-xl hover:cursor-pointer hover:bg-[#FFFFFF26] hover:scale-[1.05]  transition">Swiggy Corporate</button>
            <button class=" border-none px-5 py-1 h-[7vh] rounded-xl hover:cursor-pointer hover:bg-[#FFFFFF26] hover:scale-[1.05]  transition">Partner with us</button>
            <button class="border-white border-solid border-[1px] px-4 py-1 h-[7vh] rounded-xl hover:cursor-pointer hover:bg-[#FFFFFF26] hover:scale-[1.05] transition">Get the App <span><i class="ri-arrow-right-up-line"></i></span></button>
            <button class="bg-black border-none px-10 py-1 h-[7vh] rounded-xl hover:cursor-pointer hover:bg-[#1a1a1a] hover:scale-[1.05] transition">Sign in</button>
        </div>
    </nav>

    <section class=" mt-[100px] text-white flex flex-col gap-7 justify-center items-center">
        <h1 class="text-5xl font-bold text-center">Order food & groceries. Discover <br> best restaurants. Swiggy it!</h1>

        <div class="flex flex-col gap-[3vh] text-[#4A4A4A] font-medium sm:flex-col md:flex-col  lg:flex-row xl:flex-row 2xl:flex-row">
            <div class="border-none bg-white px-3 py-3 rounded-xl flex gap-6">
                <i class="ri-map-pin-2-fill text-2xl text-[#FF5200]"></i>
                <input class="w-[200px] outline-none" type="text border-none rounder-xl" placeholder="Enter your delivery location">
                <i class="ri-arrow-down-s-line text-2xl"></i>
            </div>

            <div class="border-none bg-white px-2 py-3 rounded-xl flex gap-30">
                <input class="w-[300px] outline-none" type="text border-none rounder-xl" placeholder="Search for restraunt, items or more">
                <i class="ri-search-2-line text-2xl"></i>
            </div>
        </div>
    </section>

    <section class="flex flex-col justify-center items-center gap-2 mt-[40px]  md:flex-row lg:flex-row xl:flex-row 2xl:flex-row">
        <img class="w-[400px] md:w-[25vw] lg:w-[25vw] xl:w-[25vw] 2xl:w-[25vw]" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/ec86a309-9b06-48e2-9adc-35753f06bc0a_Food3BU.png" alt="Food delivey from restaurants">
        <img class="w-[400px] md:w-[25vw] lg:w-[25vw] xl:w-[25vw] 2xl:w-[25vw]" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b5c57bbf-df54-4dad-95d1-62e3a7a8424d_IM3BU.png" alt="Instamart instant grocery">
        <img class="w-[400px] md:w-[25vw] lg:w-[25vw] xl:w-[25vw] 2xl:w-[25vw]" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b6d9b7ab-91c7-4f72-9bf2-fcd4ceec3537_DO3BU.png" alt="Dineout eatout & save more">
    </section>

    <img class="w-[16vw] absolute top-[16%] left-0 invisible gap-10 sm:visible md:visible lg:visible xl:visible 2xl:visible" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Veggies_new.png" alt="Vegetables in handbag">
    <img class="w-[16vw] absolute top-[16%] right-0 invisible gap-10 sm:visible md:visible lg:visible xl:visible 2xl:visible" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Sushi_replace.png" alt="healthy food">
</body>
</html>
